name: Docker Build and Push

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout - descarga el código del repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Docker set up buildx - configura el builder avanzado de Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker login - inicia sesión en Docker Hub usando los secretos
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Docker Build and Push - construye la imagen y la sube a Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rick-morty-app:latest
